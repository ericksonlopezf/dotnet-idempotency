# Dependabot configuration for EricksonLopez.Idempotency
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      database-drivers:
        patterns:
          - "Npgsql"
          - "Microsoft.Data.SqlClient"
          - "MySqlConnector"
          - "Oracle.ManagedDataAccess.Core"
          - "Microsoft.Data.Sqlite"
          - "Dapper"
      test-framework:
        patterns:
          - "xunit*"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "coverlet.*"
          - "NetArchTest.Rules"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
