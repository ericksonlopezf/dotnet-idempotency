version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      testing:
        patterns:
          - "xunit*"
          - "Testcontainers*"
          - "coverlet.*"
          - "*Assertions*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
