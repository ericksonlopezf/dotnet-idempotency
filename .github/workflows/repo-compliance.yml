name: Repository Compliance & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  compliance-audit:
    name: Compliance & Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run Architecture & Rules Compliance Suite
        shell: pwsh
        run: |
          ./scripts/verify-compliance.ps1
          ./scripts/verify-headers.ps1
          ./scripts/verify-links.ps1
          ./scripts/verify-naming.ps1
          ./scripts/validate-conventions.ps1
          ./scripts/generate-stryker-configs.ps1 -VerifyOnly

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Idempotency.slnx

      - name: Build with Strict Diagnostics (TreatWarningsAsErrors)
        run: dotnet build EricksonLopez.Idempotency.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test EricksonLopez.Idempotency.slnx --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

      - name: Validate NuGet Packages Packaging
        run: dotnet pack EricksonLopez.Idempotency.slnx --no-build --configuration Release -o artifacts/
